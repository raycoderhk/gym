name: Automated Workout Backup

on:
  # Run daily at 2 AM UTC (adjust timezone as needed)
  schedule:
    - cron: '0 2 * * *'
  # Allow manual triggering from GitHub Actions UI
  workflow_dispatch:
  # Optional: Run on push to main (for testing)
  # push:
  #   branches:
  #     - main

jobs:
  backup:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run backup script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          USER_ID: ${{ secrets.USER_ID }}
        run: |
          python backup_workouts.py
      
      - name: Upload backup artifacts
        uses: actions/upload-artifact@v4
        with:
          name: workout-backups-${{ github.run_number }}
          path: |
            workouts_*.csv
            exercises_*.csv
          retention-days: 90
          if-no-files-found: warn
      
      - name: Push backups to private repository
        if: success()
        run: |
          # Check if backup repository is configured
          if [ -z "$BACKUP_REPO" ] || [ -z "$BACKUP_REPO_TOKEN" ]; then
            echo "⚠️  Backup repository not configured. Skipping commit step."
            echo "Set BACKUP_REPO and BACKUP_REPO_TOKEN secrets to enable automatic backups."
            exit 0
          fi
          
          # Configure git
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          
          # Clone the private backup repository
          BACKUP_REPO_URL="https://${BACKUP_REPO_TOKEN}@github.com/${BACKUP_REPO}.git"
          echo "Attempting to clone private repository: ${BACKUP_REPO}"
          if ! git clone "$BACKUP_REPO_URL" backup-repo; then
            echo "❌ Failed to clone private repository"
            echo "Please verify:"
            echo "  1. BACKUP_REPO secret is correct (format: username/repo-name)"
            echo "  2. BACKUP_REPO_TOKEN is a valid PAT with 'repo' scope"
            echo "  3. PAT has access to the private repository"
            exit 1
          fi
          cd backup-repo
          
          # Find and rename backup files to simple names
          FILES_MOVED=false
          
          # Handle workout files - rename to workouts.csv
          for file in ../workouts_*.csv; do
            if [ -f "$file" ]; then
              cp "$file" "workouts.csv"
              FILES_MOVED=true
              break
            fi
          done
          
          # Handle exercise files - rename to exercises.csv
          for file in ../exercises_*.csv; do
            if [ -f "$file" ]; then
              cp "$file" "exercises.csv"
              FILES_MOVED=true
              break
            fi
          done
          
          # Commit and push if files were moved
          if [ "$FILES_MOVED" = true ]; then
            git add workouts.csv exercises.csv
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
            git commit -m "Automated backup: $TIMESTAMP" || exit 0
            git push || exit 0
            echo "✅ Backups committed to private repository"
          else
            echo "⚠️  No backup files found to commit"
          fi
        env:
          BACKUP_REPO: ${{ secrets.BACKUP_REPO }}
          BACKUP_REPO_TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
